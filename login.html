<!DOCTYPE html>
<html lang="tr" data-title-key="page.title.login">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainOps</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <script src="i18n.js"></script>
</head>
<body class="login-body">
  <div class="login-shell">
    <div class="lang-switch lang-switch-floating" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang-btn="tr">TR</button>
      <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
    </div>
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">CO</div>
        <h1>ChainOps</h1>
        <p data-i18n="brand.subtitle">Restoran Zinciri Operasyon İzleme Merkezi</p>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-form="login" data-i18n="login.signIn">Giriş Yap</button>
        <button class="login-tab" data-form="register" data-i18n="login.signUp">Kayıt Ol</button>
      </div>

      <form id="loginForm" class="login-form active">
        <div class="form-group">
          <label data-i18n="login.username">Kullanıcı Adı</label>
          <input type="text" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label data-i18n="login.password">Şifre</label>
          <input type="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" data-i18n="login.signIn">Giriş Yap</button>
        <div class="hint-box">
          <b data-i18n="login.firstUseTitle">İlk kullanım:</b><br>
          <span data-i18n="login.firstUseText">Kayıt olup yeni bir hesap oluşturun.</span>
        </div>
      </form>

      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label data-i18n="login.fullName">Ad Soyad</label>
          <input type="text" name="full_name" required />
        </div>
        <div class="form-group">
          <label data-i18n="login.username">Kullanıcı Adı</label>
          <input type="text" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label><span data-i18n="login.password">Şifre</span> <span class="hint-inline" data-i18n="login.passwordHint">(en az 6 karakter)</span></label>
          <input type="password" name="password" minlength="6" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary" data-i18n="login.signUp">Kayıt Ol</button>
      </form>

      <div id="errorBox" class="error-box"></div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
