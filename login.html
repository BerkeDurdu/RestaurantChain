<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainOps — Giriş</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-body">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">CO</div>
        <h1>ChainOps</h1>
        <p>Restoran Zinciri Operasyon İzleme Merkezi</p>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-form="login">Giriş Yap</button>
        <button class="login-tab" data-form="register">Kayıt Ol</button>
      </div>

      <form id="loginForm" class="login-form active">
        <div class="form-group">
          <label>Kullanıcı Adı</label>
          <input type="text" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary">Giriş Yap</button>
        <div class="hint-box">
          <b>İlk kullanım:</b><br>
          Kayıt olup yeni bir hesap oluşturun.
        </div>
      </form>

      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label>Ad Soyad</label>
          <input type="text" name="full_name" required />
        </div>
        <div class="form-group">
          <label>Kullanıcı Adı</label>
          <input type="text" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Şifre <span class="hint-inline">(en az 6 karakter)</span></label>
          <input type="password" name="password" minlength="6" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary">Kayıt Ol</button>
      </form>

      <div id="errorBox" class="error-box"></div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
